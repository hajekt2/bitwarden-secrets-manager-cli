name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"
          cache: pip

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-provision.txt

      - name: Verify test dependencies
        run: |
          python - <<'PY'
          import importlib.metadata
          import shutil

          for package in ("bitwarden-sdk", "python-dateutil", "six"):
              print(f"{package}=={importlib.metadata.version(package)}")
          assert shutil.which("bash"), "bash is required by the shell entrypoint tests"
          PY

      - name: Check shell syntax
        run: >-
          bash -n
          scripts/with-bws-token.sh
          scripts/check-auth.sh
          scripts/list-secret-metadata.sh
          scripts/safe-bws-run.sh

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
