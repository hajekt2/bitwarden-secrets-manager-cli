name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.3"
          cache: pip
          cache-dependency-path: requirements-provision.txt

      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements-provision.txt

      - name: Install pinned bws CLI
        env:
          BWS_SHA256: ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860
          BWS_URL: https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip
        run: |
          curl --fail --location --silent --show-error "$BWS_URL" --output "$RUNNER_TEMP/bws.zip"
          echo "$BWS_SHA256  $RUNNER_TEMP/bws.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/bws.zip" -d "$RUNNER_TEMP/bws"
          install -D -m 0755 "$RUNNER_TEMP/bws/bws" "$HOME/.local/bin/bws"

      - name: Verify test dependencies
        run: |
          python - <<'PY'
          import importlib.metadata
          import shutil

          for package in ("bitwarden-sdk", "python-dateutil", "six"):
              print(f"{package}=={importlib.metadata.version(package)}")
          assert shutil.which("bash"), "bash is required by the shell entrypoint tests"
          PY
          test "$("$HOME/.local/bin/bws" --version)" = "bws 2.1.0"

      - name: Check shell syntax
        run: >-
          bash -n
          scripts/with-bws-token.sh
          scripts/check-auth.sh
          scripts/list-secret-metadata.sh
          scripts/safe-bws-run.sh

      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
